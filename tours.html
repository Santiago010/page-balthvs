  .wp-block-post-content,

  .tour-block {

    background: var(--paper);
    max-width: var(--shell);

    box-sizing: border-box;

  .tour-block .cell-title {

    letter-spacing: -1.5px;
    margin: 14px 0 18px;
    color: #0e0c0a;
    line-height: 1;
  }

  .tour-block .cell-sub {
    font-size: clamp(18px, 1.2vw, 24px);

    color: #56524d;
    margin: 0 0 34px;
  }

  .tour-block .bit-wrap {
    text-align: left;
  }

  /* Bandsintown widget styles */
  #tourWrap [class*="-details-inner-wrapper"] > a[class*="-details"] {
    display: block;
  }
  #tourWrap [class*="-date-wrapper"] {
    width: auto;
  }
  #tourWrap [class*="-location"] {

  }
  #tourWrap [class*="-event"] {

<style>
  /* WordPress host reset — remove the Twenty Twenty-Three gap above the header */
  .wp-site-blocks {
    padding-top: 0 !important;
  }
  main,

    margin-top: 0 !important;

  .site-header {
    box-sizing: border-box;
    /* Full-bleed: break out of the WordPress constrained content column */
    width: 100vw !important;
    max-width: 100vw !important;
    margin-left: calc(50% - 50vw) !important;
    margin-right: calc(50% - 50vw) !important;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 52px;
    background: #0a0a0a;
    position: sticky;
    top: 0;
    z-index: 60;
  }
  .site-header * {
    box-sizing: border-box;
  }
  .site-logo {
    height: 29px;
    width: auto;
    display: block;
  }
  .site-nav {
    display: flex;
    gap: 40px;
    align-items: center;
  }
  .site-nav a {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    text-decoration: none;
    color: #ffffff;
    font-size: 12.5px;
    letter-spacing: 1.8px;
    white-space: nowrap;
    transition:
      color 0.2s ease,
      border-color 0.2s ease;
  }
  .site-nav a:hover {
    color: #e5dfdf;
  }
  .site-nav a.is-active {
    color: #ffffff;
    border-bottom: 2px solid #bc3a1e;
    padding-bottom: 3px;
  }
  .nav-toggle {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 70;
  }
  .nav-toggle span {
    display: block;
    height: 1.5px;
    width: 24px;
    background: #ffffff;
    transition:
      transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.2s ease;
  }
  .nav-open .nav-toggle span:nth-child(1) {
    transform: translateY(6.5px) rotate(45deg);
  }
  .nav-open .nav-toggle span:nth-child(2) {
    opacity: 0;
  }
  .nav-open .nav-toggle span:nth-child(3) {
    transform: translateY(-6.5px) rotate(-45deg);
  }

  @media (max-width: 768px) {
    .site-header {
      padding: 18px 22px;
    }
    .nav-toggle {
      display: flex;
    }
    .site-nav {
      box-sizing: border-box;
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: min(320px, 84vw);
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 26px;
      padding: 40px 44px;
      background: #0a0a0a;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: -24px 0 60px rgba(20, 12, 6, 0.16);
      transform: translateX(100%);
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 65;
    }
    .nav-open .site-nav {
      transform: translateX(0);
    }
    .site-nav a {
      font-size: 16px;
      letter-spacing: 2.4px;
    }
    .nav-scrim {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 6, 0.45);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
      z-index: 55;
    }
    .nav-open .nav-scrim {
      opacity: 1;
      visibility: visible;
    }
  }
</style>

<script>
  (function () {
    var root = document.documentElement;
    var toggle = document.getElementById("navToggle");
    var scrim = document.getElementById("navScrim");
    var nav = document.getElementById("siteNav");
    if (!toggle || !nav) return;
    function closeNav() {
      root.classList.remove("nav-open");
      toggle.setAttribute("aria-expanded", "false");
    }
    function toggleNav() {
      var open = root.classList.toggle("nav-open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }
    toggle.addEventListener("click", toggleNav);
    scrim.addEventListener("click", closeNav);
    nav.addEventListener("click", function (e) {
      if (e.target.tagName === "A") closeNav();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeNav();
    });
  })();
</script>

<!-- Script que mueve el bit-play-my-city-wrapper debajo del texto "Every upcoming show..." -->
<script>
  (function () {
    function movePlayMyCity() {
      // Ya ejecutado
      if (window.__bitPlayMyCityMoved) return true;

      var playMyCity = document.querySelector(
        "#tourWrap .bit-follow-section-wrapper",
      );
      if (!playMyCity) return false;

      // El texto objetivo
      var targetText = document.querySelector(".tour-block .cell-sub");
      if (!targetText) return false;

      // Insertar justo después del texto "Every upcoming show, live from Bandsintown."
      targetText.insertAdjacentElement("afterend", playMyCity);

      // Marcar como ejecutado para no duplicar
      window.__bitPlayMyCityMoved = true;
      return true;
    }

    // Intentar inmediatamente (por si el widget ya cargó)
    if (movePlayMyCity()) return;

    // Observer para esperar a que el widget termine de renderizar
    var observer = new MutationObserver(function () {
      if (movePlayMyCity()) observer.disconnect();
    });
    observer.observe(document.getElementById("tourWrap"), {
      childList: true,
      subtree: true,
    });

    // Timeout de seguridad
    setTimeout(function () {
      observer.disconnect();
    }, 8000);
  })();
</script>
