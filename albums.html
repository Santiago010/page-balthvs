<style>
  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    font-family: "Nunito Sans", sans-serif;
    background: #fff;
    color: #000;
  }

  .page {
    width: 100%;
    max-width: 2200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-top: 4vh;
    padding-bottom: 1vh;
  }

  .section-title {
    margin: 0;
    font-size: 36px;
    letter-spacing: 0.25em;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
  }

  .section-title::before,
  .section-title::after {
    content: "•";
    margin: 0 0.35em;
  }

  .bg-divider {
    width: 42.43%;
    height: 10.4vh;
    background: url("https://balthvs.com/wp-content/uploads/2025/12/HEADERSArtboard-2-scaled.png")
      center/contain no-repeat;
  }

  .bg-divider.top {
    margin-top: 0.5vh;
    transform: rotate(180deg);
  }

  .bg-divider.bottom {
    margin-top: 8vh;
    transform: rotate(0deg);
  }

  .album-grid {
    width: 100%;
    box-sizing: border-box;
    margin-top: 3.8vh;
    padding: 0 6vw;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 3.2vw;
  }

  .album-grid a {
    display: block;
    text-decoration: none;
  }

  .album-grid img {
    width: 100%;
    height: auto;
    display: block;
  }

  .album-cap {
    display: block;
    margin-top: 10px;
    text-align: center;
    color: #000;
    line-height: 1.3;
  }

  .album-cap .ac-name {
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  .album-cap .ac-date {
    display: block;
    font-size: 13px;
    color: #555;
    margin-top: 2px;
  }

  /* Desktop: up to 5 per row; an incomplete last row stays centered */
  @media (min-width: 769px) {
    .album-grid {
      gap: 1.6vw;
      padding: 0 3.2vw;
    }
    .album-grid a {
      flex: 0 0 calc((100% - 4 * 1.6vw) / 5);
    }
  }

  /* Mobile layout */
  @media (max-width: 768px) {
    .section-title {
      font-size: 27px;
    }

    .bg-divider {
      width: 63.645%;
      height: 15.6vh;
    }

    .album-grid {
      gap: 3.2vw;
      padding: 0 6vw;
    }

    /* 2 per row; an incomplete last row stays centered */
    .album-grid a {
      flex: 0 0 calc((100% - 3.2vw) / 2);
    }
  }

  .footer {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 6vh;
  }

  .copyright {
    margin-top: 2vh;
    font-style: italic;
    font-size: 16px;
    letter-spacing: 0.06em;
    text-align: center;
  }

  .social-row {
    display: flex;
    gap: 36px;
    margin-top: 2vh;
    justify-content: center;
  }

  .social-row img {
    height: 44px;
    display: block;
  }

  @media (max-width: 480px) {
    .copyright {
      font-size: 11.2px;
    }
    .social-row img {
      height: 22px;
    }
  }
</style>

<!-- ===== Embedded BALTHVS navigation header ===== -->
<style>
  /* WordPress host reset — remove the Twenty Twenty-Three gap above the header */
  .wp-site-blocks {
    padding-top: 0 !important;
  }
  main,
  .entry-content {
    margin-top: 0 !important;
  }
  .page {
    margin-top: 0 !important;
  }
  .site-header {
    margin-top: 0 !important;
  }

  .site-header {
    box-sizing: border-box;
    /* Full-bleed: break out of the WordPress constrained content column */
    width: 100vw !important;
    max-width: 100vw !important;
    margin-left: calc(50% - 50vw) !important;
    margin-right: calc(50% - 50vw) !important;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 52px;
    background: #0a0a0a;
    position: sticky;
    top: 0;
    z-index: 60;
  }
  .site-header * {
    box-sizing: border-box;
  }
  .site-logo {
    height: 29px;
    width: auto;
    display: block;
  }
  .site-nav {
    display: flex;
    gap: 40px;
    align-items: center;
  }
  .site-nav a {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    text-decoration: none;
    color: #ffffff;
    font-size: 12.5px;
    letter-spacing: 1.8px;
    white-space: nowrap;
    transition:
      color 0.2s ease,
      border-color 0.2s ease;
  }
  .site-nav a:hover {
    color: #e5dfdf;
  }
  .site-nav a.is-active {
    color: #ffffff;
    border-bottom: 2px solid #bc3a1e;
    padding-bottom: 3px;
  }
  .nav-toggle {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 70;
  }
  .nav-toggle span {
    display: block;
    height: 1.5px;
    width: 24px;
    background: #ffffff;
    transition:
      transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.2s ease;
  }
  .nav-open .nav-toggle span:nth-child(1) {
    transform: translateY(6.5px) rotate(45deg);
  }
  .nav-open .nav-toggle span:nth-child(2) {
    opacity: 0;
  }
  .nav-open .nav-toggle span:nth-child(3) {
    transform: translateY(-6.5px) rotate(-45deg);
  }

  @media (max-width: 768px) {
    .site-header {
      padding: 18px 22px;
    }
    .nav-toggle {
      display: flex;
    }
    .site-nav {
      box-sizing: border-box;
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: min(320px, 84vw);
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 26px;
      padding: 40px 44px;
      background: #0a0a0a;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: -24px 0 60px rgba(20, 12, 6, 0.16);
      transform: translateX(100%);
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 65;
    }
    .nav-open .site-nav {
      transform: translateX(0);
    }
    .site-nav a {
      font-size: 16px;
      letter-spacing: 2.4px;
    }
    .nav-scrim {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 6, 0.45);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
      z-index: 55;
    }
    .nav-open .nav-scrim {
      opacity: 1;
      visibility: visible;
    }
  }
</style>

<header class="site-header">
  <a href="https://balthvs.com/" aria-label="BALTHVS home">
    <img
      class="site-logo"
      src="https://balthvs.com/wp-content/uploads/2026/06/BALTHVS_LOGO_WHITE.png"
      alt="BALTHVS"
    />
  </a>

  <button
    class="nav-toggle"
    id="navToggle"
    type="button"
    aria-label="Menu"
    aria-expanded="false"
    aria-controls="siteNav"
  >

  </button>

  <nav class="site-nav" id="siteNav" aria-label="Primary">

    <a

    >
    <a
      href="https://laylo.com/balthvs"

      >SUBSCRIBE</a
    >
    <a href="https://balthvs.com/about/">ABOUT</a>
    <a href="https://balthvs.com/contact/">CONTACTS</a>
  </nav>
</header>
<div class="nav-scrim" id="navScrim" aria-hidden="true"></div>

<script>
  (function () {
    var root = document.documentElement;
    var toggle = document.getElementById("navToggle");
    var scrim = document.getElementById("navScrim");
    var nav = document.getElementById("siteNav");
    if (!toggle || !nav) return;
    function closeNav() {
      root.classList.remove("nav-open");
      toggle.setAttribute("aria-expanded", "false");
    }
    function toggleNav() {
      var open = root.classList.toggle("nav-open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }
    toggle.addEventListener("click", toggleNav);
    scrim.addEventListener("click", closeNav);
    nav.addEventListener("click", function (e) {
      if (e.target.tagName === "A") closeNav();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeNav();
    });
  })();
</script>
